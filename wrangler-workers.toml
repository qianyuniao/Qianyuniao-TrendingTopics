name = "qyn-trending"
account_id = "d5648cdc564098df53c42efab61f2a20"
compatibility_date = "2026-10-03"
compatibility_flags = [ "nodejs_compat" ]
main = "dist/output/public/_worker.js/index.js"
upload_source_maps = false

[assets]
directory = "dist/output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "TRENDING_DB"
database_name = "qianyuniao-trendingtopics"
database_id = "09e10efe-2dc4-48c8-b3aa-c6d9df8abcf6"

# 固定域名：仅绑已确认健康的 zone（eu.org 被 Bot Fight Mode 403，cc.cd DNS 不通）
[[routes]]
pattern = "trending.qianyuniao.ccwu.cc"
custom_domain = true
